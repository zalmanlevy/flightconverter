    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-color: #1f2937;
            --border-color: #e5e7eb;
            --error-color: #dc2626;
            --success-color: #16a34a;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            width: 100%;
            max-width: 800px;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
            color: #111827;
            text-align: center;
        }

        .instructions {
            font-size: 0.9rem;
            color: #6b7280;
            margin-bottom: 1rem;
            text-align: center;
        }

        textarea {
            width: 100%;
            height: 300px;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-family: monospace;
            font-size: 0.85rem;
            resize: vertical;
            box-sizing: border-box; /* Ensures padding doesn't affect width */
            margin-bottom: 1rem;
        }

        textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        button {
            width: 100%;
            background-color: var(--primary-color);
            color: white;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        #status {
            margin-top: 1rem;
            padding: 10px;
            border-radius: 6px;
            font-size: 0.9rem;
            display: none;
        }

        .error {
            background-color: #fee2e2;
            color: var(--error-color);
            border: 1px solid #fecaca;
        }

        .success {
            background-color: #dcfce7;
            color: var(--success-color);
            border: 1px solid #bbf7d0;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Flight to Calendar (.ics)</h1>
    <p class="instructions">Paste your Tab-Separated flight data (from Excel/Sheets) below:</p>
    
    <textarea id="csvInput" placeholder="Date	Airline	Airports	Flight_Description..."></textarea>
    
    <button onclick="processData()">Create iCalendar File</button>
    
    <div id="status"></div>
</div>

<script>
    // --- Configuration ---
    const REQUIRED_HEADERS = ['Date', 'Airline', 'Airports', 'Flight_Description', 'Flyers', 'Status', 'Confirm#', 'Flight#', 'Depart', 'Arrive', 'Refundable'];
    // Note: Python script used '2nd_C#', 'Price', 'Miles', 'Credit', 'Desc2' as optional/get-safe

    function showStatus(message, type) {
        const statusEl = document.getElementById('status');
        statusEl.style.display = 'block';
        statusEl.className = type;
        statusEl.innerText = message;
    }

    // Helper to pad numbers with leading zeros (e.g., 5 -> "05")
    function pad(num) {
        return num.toString().padStart(2, '0');
    }

    // Parse "MM/DD/YYYY"
    function parseDateString(dateStr) {
        const parts = dateStr.split('/');
        if (parts.length !== 3) throw new Error("Invalid date format");
        return {
            month: parseInt(parts[0], 10),
            day: parseInt(parts[1], 10),
            year: parseInt(parts[2], 10)
        };
    }

    // Parse "HH:MM AM/PM" into 24h format
    function parseTimeString(timeStr) {
        const match = timeStr.match(/(\d+):(\d+)\s*(AM|PM)/i);
        if (!match) throw new Error("Invalid time format");
        
        let hour = parseInt(match[1], 10);
        const minute = parseInt(match[2], 10);
        const meridiem = match[3].toUpperCase();

        if (meridiem === 'PM' && hour !== 12) hour += 12;
        if (meridiem === 'AM' && hour === 12) hour = 0;

        return { hour, minute };
    }

    // Generate ICS Date String: YYYYMMDDTHHMMSS
    function formatICSDate(year, month, day, hour, minute) {
        return `${year}${pad(month)}${pad(day)}T${pad(hour)}${pad(minute)}00`;
    }

    function processData() {
        const input = document.getElementById('csvInput').value.trim();
        if (!input) {
            showStatus("Please paste some data first.", "error");
            return;
        }

        // 1. Parse CSV/TSV
        const rows = input.split('\n').map(row => row.split('\t'));
        
        if (rows.length < 2) {
            showStatus("Not enough data detected. Ensure headers and rows are present.", "error");
            return;
        }

        // Clean headers (trim whitespace)
        const headers = rows[0].map(h => h.trim());
        
        // Validation
        const missing = REQUIRED_HEADERS.filter(h => !headers.includes(h));
        if (missing.length > 0) {
            showStatus(`Missing essential columns: ${missing.join(', ')}`, "error");
            return;
        }

        let eventsAdded = 0;
        let icalContent = [
            "BEGIN:VCALENDAR",
            "VERSION:2.0",
            "PRODID:-//Flight Calendar Generator//Web Version//EN",
            "CALSCALE:GREGORIAN"
        ];

        // Process Rows
        for (let i = 1; i < rows.length; i++) {
            const rowData = rows[i];
            
            // Skip empty rows
            if (rowData.length < 2) continue;

            // Map data to object based on headers
            const row = {};
            headers.forEach((header, index) => {
                row[header] = rowData[index] ? rowData[index].trim() : "";
            });

            // Check if essential fields are empty in this row
            if (!row['Date'] || !row['Depart'] || !row['Airline']) continue;

            try {
                // --- Logic ported from Python ---
                
                // 1. Date & Time Parsing
                const dateParts = parseDateString(row['Date']);
                const departTime = parseTimeString(row['Depart']);
                const arriveTime = parseTimeString(row['Arrive']);

                // Create JS Date objects for comparison logic (handling next-day arrival)
                // We use generic dates just to compare timestamps
                const startObj = new Date(dateParts.year, dateParts.month - 1, dateParts.day, departTime.hour, departTime.minute);
                let endObj = new Date(dateParts.year, dateParts.month - 1, dateParts.day, arriveTime.hour, arriveTime.minute);

                // Adjust for next day arrival
                if (endObj < startObj) {
                    endObj.setDate(endObj.getDate() + 1);
                }

                // Format for ICS
                // Note: Python used pytz 'America/New_York'. 
                // In ICS, we can specify TZID or use floating time. 
                // To match Python logic exactly, we will apply the TZID parameter.
                
                const startString = formatICSDate(startObj.getFullYear(), startObj.getMonth() + 1, startObj.getDate(), startObj.getHours(), startObj.getMinutes());
                const endString = formatICSDate(endObj.getFullYear(), endObj.getMonth() + 1, endObj.getDate(), endObj.getHours(), endObj.getMinutes());
                
                const now = new Date();
                const dtStamp = formatICSDate(now.getFullYear(), now.getMonth() + 1, now.getDate(), now.getHours(), now.getMinutes());

                // 2. Build Description
                const confirmNum = row['Confirm#'];
                const secondConfirm = row['2nd_C#'] || "";
                const flyers = row['Flyers'];
                const airports = row['Airports'];
                const airline = row['Airline'];
                const flightNum = row['Flight#'];
                const price = row['Price'] || "";
                const miles = row['Miles'] || "";
                const refundable = row['Refundable'];
                const desc2 = row['Desc2'] || "";
                const status = row['Status'];
                const credit = row['Credit'] || "";
                const flightDesc = row['Flight_Description'];

                // Google Search URL
                const searchQ = `${airline} flight ${flightNum}`.replace(/ /g, '+');
                const googleUrl = `https://www.google.com/search?q=${searchQ}`;

                // Construct Description Text
                let descText = `Confirmation: ${confirmNum}\\n`;
                if (secondConfirm) descText += `2nd_C#: ${secondConfirm}\\n`;
                descText += `${flyers}\\n`;
                
                descText += `\\nAirports: ${airports}\\nAirline: ${airline}\\nFlight Number: ${flightNum}\\n`;
                // Simple date string for description body
                const dateDisplay = startObj.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
                descText += `Date: ${dateDisplay}\\nDepart: ${row['Depart']}\\nArrive: ${row['Arrive']}\\n`;
                
                descText += `\\n${googleUrl}\\n\\n`;
                descText += `Refundable: ${refundable}\\n`;
                descText += `Description: ${flightDesc}\\n`;
                
                if (desc2) descText += `Desc2: ${desc2}\\n`;
                descText += `Status: ${status}\\n`;
                descText += `Price: ${price}\\n`;
                descText += `Miles: ${miles}`;
                if (credit) descText += `\\nCredit: ${credit}`;

                const todayStr = `${pad(now.getMonth()+1)}-${pad(now.getDate())}-${now.getFullYear()}`;
                descText += `\\n\\nImported-${todayStr}`;

                // 3. Create Event Block
                const summary = `${airline}: ${airports}, ${flyers}`;
                
                // Extract Location (first part of Airports string)
                let location = airports;
                if (airports.includes('-')) {
                    location = airports.split('-')[0].trim();
                }

                icalContent.push("BEGIN:VEVENT");
                icalContent.push(`DTSTAMP:${dtStamp}`);
                // Applying New York Timezone as per Python script requirement
                icalContent.push(`DTSTART;TZID=America/New_York:${startString}`);
                icalContent.push(`DTEND;TZID=America/New_York:${endString}`);
                icalContent.push(`SUMMARY:${summary}`);
                icalContent.push(`LOCATION:${location}`);
                icalContent.push(`DESCRIPTION:${descText}`);
                
                icalContent.push("END:VEVENT");
                eventsAdded++;

            } catch (e) {
                console.error("Row processing error:", e, row);
                // Continue to next row
            }
        }

        icalContent.push("END:VCALENDAR");

        if (eventsAdded === 0) {
            showStatus("No events were created. Check data format.", "error");
            return;
        }

        // --- Download File ---
        const finalContent = icalContent.join("\r\n");
        const blob = new Blob([finalContent], { type: 'text/calendar;charset=utf-8' });
        
        const now = new Date();
        const filenameDate = `${pad(now.getMonth()+1)}-${pad(now.getDate())}-${now.getFullYear()}`;
        const filename = `Imported-${filenameDate}.ics`;

        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);

        showStatus(`Success! Created ${eventsAdded} events. Check your downloads.`, "success");
    }
</script>
